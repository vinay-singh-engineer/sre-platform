name: Deploy

on:
  # Auto-deploy disabled until AWS infrastructure is provisioned.
  # Uncomment the block below once AWS_DEPLOY_ROLE_ARN secret is set.
  # push:
  #   branches: [main]
  #   paths:
  #     - "app/**"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: false
        default: ""

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: sre-platform-prod
  EKS_CLUSTER: sre-platform-prod

jobs:
  deploy:
    name: Build → Push → Deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write   # OIDC auth to AWS
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          labels: |
            git.commit=${{ github.sha }}
            git.branch=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER }}

      - name: Inject image into deployment manifest
        run: |
          IMAGE="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}"
          sed -i "s|REPLACE_WITH_ECR_IMAGE|$IMAGE|g" k8s/deployment.yml

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/sre-platform \
            --namespace sre-platform \
            --timeout=300s

      - name: Smoke test
        run: |
          LB_HOST=$(kubectl get service sre-platform \
            --namespace sre-platform \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

          for i in {1..10}; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "http://$LB_HOST/health/ready" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test passed."
              exit 0
            fi
            sleep 15
          done
          echo "Smoke test FAILED after 10 attempts"
          exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment failed for ${{ github.sha }}. Check EKS console."
          # Wire this to Slack/PagerDuty in real setups:
          # curl -X POST "${{ secrets.SLACK_WEBHOOK }}" \
          #   -d '{"text":"DEPLOY FAILED: ${{ github.repository }}@${{ github.sha }}"}'
