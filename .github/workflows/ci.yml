name: CI

on:
  push:
    branches: [main, development]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r app/requirements.txt pytest pytest-cov flake8

      - name: Lint (flake8)
        run: flake8 app/ --max-line-length=100 --exclude=app/tests

      - name: Run tests with coverage
        run: |
          cd app
          PYTHONPATH=. pytest tests/ -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: app/coverage.xml
          fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scanners
        run: pip install bandit pip-audit

      - name: Run Bandit (SAST)
        run: bandit -r app/app.py -ll -f json -o bandit-report.json || true

      - name: Print Bandit findings
        run: cat bandit-report.json | python -m json.tool

      - name: Run pip-audit (dependency CVEs)
        run: pip-audit -r app/requirements.txt

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push — CI only)
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: false
          tags: sre-platform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.7"

      - name: Init (modules only, no backend)
        run: terraform -chdir=terraform/environments/prod init -backend=false

      - name: Validate
        run: terraform -chdir=terraform/environments/prod validate

      - name: Format check
        run: terraform fmt -check -recursive terraform/
