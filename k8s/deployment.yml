apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-platform
  namespace: sre-platform
  labels:
    app: sre-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sre-platform
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: sre-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: sre-platform
          image: REPLACE_WITH_ECR_IMAGE
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: sre-platform-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Give in-flight requests time to complete before shutdown
                command: ["/bin/sh", "-c", "sleep 5"]
